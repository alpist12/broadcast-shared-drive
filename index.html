<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- 검색 엔진(구글, 네이버, 다음, 빙 등) 색인 및 검색 노출 완전 차단 (링크를 아는 사람만 접속 가능) -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="Yeti" content="noindex, nofollow, noarchive">
  <meta name="Daumoa" content="noindex, nofollow, noarchive">
  <title>방송국 공유 드라이브 · Broadcast Cloud</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --primary-soft: #EFF6FF;
      --accent: #6366F1;
      --bg: #F3F6FA;
      --surface: #FFFFFF;
      --sidebar-bg: #0B1120;
      --sidebar-card: #151F32;
      --sidebar-border: rgba(255, 255, 255, 0.08);
      --text: #0F172A;
      --text-sub: #475569;
      --text-muted: #94A3B8;
      --border: #E2E8F0;
      --border-light: #F1F5F9;
      --danger: #EF4444;
      --success: #10B981;
      --warning: #F59E0B;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.015em;
      word-break: keep-all;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    button, input, textarea, select { font-family: inherit; }
    button { cursor: pointer; border: none; background: transparent; }

    /* Main Shell */
    .app-shell {
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
      background: var(--bg);
      position: relative;
    }

    /* Studio Dark Sidebar */
    .sidebar {
      width: 284px;
      flex-shrink: 0;
      background: linear-gradient(180deg, #0B1120 0%, #0F172A 100%);
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      padding: 22px 16px 18px;
      gap: 18px;
      border-right: 1px solid #1E293B;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 6px;
    }
    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(135deg, #3B82F6 0%, #6366F1 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px -4px rgba(59, 130, 246, 0.55);
      flex-shrink: 0;
      position: relative;
    }
    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #FFFFFF;
      line-height: 1.2;
    }
    .brand-sub {
      font-size: 11.5px;
      color: #94A3B8;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
      font-weight: 500;
    }
    .live-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
      display: inline-block;
      animation: pulseGlow 2s infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }
      50% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0.4); }
    }

    .new-btn-desktop {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563EB 0%, #4F46E5 100%);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 10px 24px -6px rgba(37, 99, 235, 0.6);
      transition: transform 0.12s, box-shadow 0.15s, filter 0.15s;
    }
    .new-btn-desktop:hover {
      filter: brightness(1.08);
      box-shadow: 0 12px 28px -6px rgba(37, 99, 235, 0.75);
    }
    .new-btn-desktop:active { transform: scale(0.98); }

    .side-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }
    .side-nav-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748B;
      padding: 6px 12px 4px;
    }
    .side-nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      padding: 0 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      color: #94A3B8;
      transition: all 0.15s;
    }
    .side-nav-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #F1F5F9;
    }
    .side-nav-item.active {
      background: rgba(59, 130, 246, 0.16);
      color: #60A5FA;
      font-weight: 700;
      box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.25);
    }
    .nav-count-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.07);
      color: #94A3B8;
      font-variant-numeric: tabular-nums;
    }
    .side-nav-item.active .nav-count-pill {
      background: rgba(59, 130, 246, 0.25);
      color: #93C5FD;
    }

    /* Bottom Left Storage Status & Total Capacity Widget */
    .sidebar-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .storage-widget {
      padding: 15px;
      border-radius: 16px;
      background: linear-gradient(160deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 25px -10px rgba(0, 0, 0, 0.5);
    }
    .storage-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .storage-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #F8FAFC;
    }
    .always-on-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 99px;
      font-size: 10.5px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.16);
      color: #34D399;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }
    .capacity-numbers {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 2px;
    }
    .capacity-used {
      font-size: 18px;
      font-weight: 800;
      color: #FFFFFF;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .capacity-total {
      font-size: 12px;
      font-weight: 600;
      color: #94A3B8;
      font-variant-numeric: tabular-nums;
    }
    .storage-bar-segmented {
      height: 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      display: flex;
      gap: 1px;
    }
    .seg-bar { height: 100%; transition: width 0.3s ease; }
    .storage-legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px 8px;
      font-size: 11px;
      color: #94A3B8;
      padding-top: 2px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }
    .legend-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .storage-cfg-btn {
      margin-top: 2px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #E2E8F0;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .storage-cfg-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    /* Main Content Area */
    .main-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
    }

    /* Top Header */
    .top-header {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 68px;
      z-index: 10;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #334155;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: #E2E8F0; color: #0F172A; }

    .header-title-wrap {
      flex: 1;
      min-width: 0;
    }
    .header-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #0F172A;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12.5px;
      color: var(--text-sub);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      margin-top: 2px;
    }
    .breadcrumbs::-webkit-scrollbar { display: none; }
    .crumb-link {
      cursor: pointer;
      color: var(--text-sub);
      padding: 1px 5px;
      border-radius: 5px;
      font-weight: 500;
    }
    .crumb-link:hover { background: #E2E8F0; color: var(--primary); }

    .search-box-desktop {
      width: 310px;
      height: 42px;
      background: #F1F5F9;
      border-radius: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      color: var(--text-sub);
      border: 1.5px solid transparent;
      transition: all 0.15s;
    }
    .search-box-desktop:focus-within {
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }
    .search-box-desktop input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      color: var(--text);
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px 5px 5px;
      border-radius: 99px;
      background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%);
      color: #3730A3;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #C7D2FE;
      flex-shrink: 0;
      transition: transform 0.1s;
    }
    .user-pill:hover { transform: translateY(-1px); }
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4F46E5 0%, #2563EB 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
    }

    /* Quick Category Filter Chips + Toolbar */
    .sub-toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 22px 10px;
      flex-wrap: wrap;
    }
    .filter-chips {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar { display: none; }
    .chip-btn {
      height: 34px;
      padding: 0 13px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .chip-btn:hover { border-color: #CBD5E1; background: #F8FAFC; }
    .chip-btn.active {
      background: #0F172A;
      color: #FFFFFF;
      border-color: #0F172A;
      box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.25);
    }

    .sort-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 34px;
      padding: 0 10px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      color: #334155;
      background: #fff;
      border: 1px solid #E2E8F0;
    }
    .sort-btn:hover { background: #F8FAFC; }

    /* Mobile Storage Banner (Visible on small screens) */
    .mobile-storage-bar {
      display: none;
      margin: 0 16px 10px;
      padding: 10px 14px;
      border-radius: 14px;
      background: #0F172A;
      color: #fff;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
    }

    /* File Scroll Area */
    .file-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 22px 120px;
    }

    .drop-overlay {
      position: absolute;
      inset: 14px;
      border: 2.5px dashed var(--primary);
      border-radius: 22px;
      background: rgba(239, 246, 255, 0.94);
      z-index: 35;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--primary);
      pointer-events: none;
    }
    .drop-overlay.active { display: flex; }

    /* List View */
    .file-list {
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #E2E8F0;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 16px -6px rgba(15, 23, 42, 0.05);
    }
    .file-row {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 70px;
      padding: 10px 12px 10px 18px;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      transition: background 0.12s;
    }
    .file-row:last-child { border-bottom: none; }
    .file-row:hover { background: #F8FAFC; }

    .video-thumb-sm {
      width: 68px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 9px;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 60%, #334155 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.9);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
    }
    .dur-badge {
      position: absolute;
      right: 4px;
      bottom: 3px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9.5px;
      font-weight: 600;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      background: rgba(0,0,0,0.75);
      color: #fff;
    }

    .icon-box {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .row-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .row-name {
      font-size: 15px;
      font-weight: 600;
      color: #0F172A;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .edit-tag {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: #DBEAFE;
      color: #1D4ED8;
      flex-shrink: 0;
    }
    .row-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-quick-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    /* Grid View */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
      gap: 14px;
    }
    .grid-card {
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      background: #fff;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      display: flex;
      flex-direction: column;
    }
    .grid-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -8px rgba(15, 23, 42, 0.12);
      border-color: #93C5FD;
    }
    .grid-thumb {
      aspect-ratio: 16/10;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .grid-footer {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 6px 10px 13px;
    }

    /* Upload Progress Bar */
    .upload-floating-bar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 24px;
      width: min(440px, calc(100vw - 32px));
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      background: #0F172A;
      color: #fff;
      box-shadow: 0 14px 34px -8px rgba(15, 23, 42, 0.6);
      cursor: pointer;
      z-index: 45;
    }

    .fab-btn {
      position: fixed;
      right: 20px;
      bottom: 24px;
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: linear-gradient(135deg, #2563EB 0%, #4F46E5 100%);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px -6px rgba(37, 99, 235, 0.65);
      z-index: 40;
    }

    .bottom-nav {
      display: none;
      height: 76px;
      padding: 6px 8px 18px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      grid-template-columns: repeat(5, minmax(0, 1fr));
      z-index: 30;
      flex-shrink: 0;
    }
    .bottom-nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
    }
    .bottom-nav-btn.active {
      color: var(--primary);
      font-weight: 700;
    }

    /* Modals & Sheets */
    .detail-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .detail-panel {
      width: min(700px, 100%);
      max-height: 92dvh;
      background: #fff;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.4);
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.46);
      backdrop-filter: blur(3px);
      z-index: 70;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-box {
      width: min(520px, 100%);
      max-height: 88dvh;
      overflow-y: auto;
      background: #fff;
      border-radius: 24px 24px 0 0;
      padding: 10px 18px 34px;
      box-shadow: 0 -12px 40px -12px rgba(15, 23, 42, 0.3);
    }
    @media (min-width: 769px) {
      .sheet-backdrop { align-items: center; padding: 16px; }
      .sheet-box { border-radius: 24px; padding: 20px 24px 26px; }
    }

    .editor-textarea {
      width: 100%;
      min-height: 320px;
      padding: 14px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-family: 'Pretendard Variable', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      line-height: 1.65;
      color: var(--text);
      background: #F8FAFC;
      outline: none;
      resize: vertical;
    }
    .editor-textarea:focus {
      background: #fff;
      border-color: var(--primary);
    }

    .toast-container {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 96px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      z-index: 100;
      pointer-events: none;
    }
    .toast-item {
      display: flex;
